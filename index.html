          <main id="catalog" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
            
            <div className="text-center space-y-2 mb-10">
              <span className="text-xs uppercase tracking-widest text-emerald-400 font-bold">আমাদের বিশেষ নার্সারি স্টক</span>
              <h3 className="text-2xl sm:text-3xl font-extrabold text-white">
                জনপ্রিয় ফলদ ও ছাদ বাগানের চারাগাছ
              </h3>
              <p className="text-xs sm:text-sm text-emerald-200/80 max-w-xl mx-auto">
                পছন্দের চারাগাছটি সিলেক্ট করে সরাসরি ১-ক্লিকে হোয়াটসঅ্যাপে ক্যাশ অন ডেলিভারিতে অর্ডার কনফার্ম করুন।
              </p>
            </div>

            {/* Category Filter Tabs */}
            <div className="flex flex-wrap justify-center gap-2 mb-8">
              {[
                { id: 'all', label: 'সব জাতের চারা' },
                { id: 'banana', label: '🍌 রঙিন সাগর কলা ও সুপারি' },
                { id: 'papaya', label: '🍈 রেড লেডি পেঁপে' },
                { id: 'pomegranate', label: '🍎 মিষ্টি ডালিম ও আপেল' },
                { id: 'exotic', label: '🥭 বিদেশি এক্সোটিক কম্বো' }
              ].map(cat => (
                <button
                  key={cat.id}
                  onClick={() => setSelectedCategory(cat.id)}
                  className={'px-4 py-2 rounded-xl text-xs font-bold transition ' + (
                    selectedCategory === cat.id
                      ? 'bg-emerald-500 text-stone-950 shadow-lg shadow-emerald-500/20'
                      : 'bg-nursery-900/90 text-emerald-200 hover:bg-nursery-800 border border-emerald-900'
                  )}
                >
                  {cat.label}
                </button>
              ))}
            </div>

            {/* Product Cards Grid */}
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredProducts.map(product => (
                <div 
                  key={product.id}
                  className="rounded-2xl bg-nursery-900/80 border border-emerald-500/20 overflow-hidden flex flex-col justify-between hover:border-emerald-400/50 transition duration-300 group plant-shadow"
                >
                  <div>
                    {/* Image & Tag */}
                    <div className="relative h-64 overflow-hidden bg-stone-950">
                      <img 
                        src={product.image} 
                        alt={product.title} 
                        className="w-full h-full object-cover transition duration-500 group-hover:scale-105"
                      />
                      <div className="absolute top-3 left-3 bg-emerald-500 text-stone-950 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                        {product.tag}
                      </div>
                      <div className="absolute top-3 right-3 bg-nursery-950/80 backdrop-blur-md border border-emerald-500/30 text-emerald-300 text-[10px] font-semibold px-2.5 py-0.5 rounded-full">
                        ⏱️ {product.maturity}
                      </div>
                    </div>

                    {/* Content */}
                    <div className="p-5 space-y-2.5">
                      <div className="flex items-center gap-2 text-[11px] text-emerald-400 font-semibold">
                        <span>🌱 {product.plantType}</span>
                      </div>

                      <h4 className="text-base font-bold text-white leading-snug group-hover:text-emerald-300 transition">
                        {product.title}
                      </h4>

                      <p className="text-xs text-emerald-100/70 leading-relaxed">
                        {product.description}
                      </p>
                    </div>
                  </div>

                  {/* Price & Booking Button */}
                  <div className="p-5 pt-0">
                    <div className="flex items-baseline justify-between mb-3">
                      <div>
                        <span className="text-xs text-emerald-300/50 line-through">৳{product.originalPrice}</span>
                        <div className="text-xl font-extrabold text-emerald-400">
                          ৳{product.price} <span className="text-xs font-normal text-emerald-200">/প্রতি চারা</span>
                        </div>
                      </div>
                      <span className="text-[11px] text-emerald-400 font-semibold bg-emerald-950/60 border border-emerald-500/30 px-2 py-0.5 rounded">
                        ক্যাশ অন ডেলিভারি
                      </span>
                    </div>

                    <button
                      onClick={() => setOrderModalProduct(product)}
                      className="w-full py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 via-emerald-600 to-emerald-700 hover:from-emerald-600 hover:to-emerald-800 text-stone-950 font-bold text-xs shadow-md transition flex items-center justify-center gap-2"
                    >
                      <span>১-ক্লিকে WhatsApp অর্ডার</span>
                      <span>➔</span>
                    </button>
                  </div>

                </div>
              ))}
            </div>

          </main>

          {/* Location & Nursery Info */}
          <section className="bg-nursery-900/60 border-t border-b border-emerald-500/20 py-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="bg-nursery-950/80 rounded-2xl border border-emerald-500/30 p-6 md:p-8">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center text-center md:text-left">
                  
                  <div>
                    <span className="text-xs uppercase tracking-widest text-emerald-400 font-bold">১০০% জাতের সত্যতা</span>
                    <h4 className="text-xl font-bold text-white mt-1">গ্রীন ওয়ার্ল্ড নার্সারি গ্যারান্টি</h4>
                    <p className="text-xs text-emerald-200/80 mt-1 leading-relaxed">
                      আমরা কোনো সাধারণ বীজের চারা বিক্রি করি না। প্রতিটি চারা পরীক্ষিত ও ফলন্ত মাদার গাছ থেকে গ্রাফটিং/কলম করা।
                    </p>
                  </div>

                  <div className="p-4 rounded-xl bg-nursery-900/60 border border-emerald-800 text-left space-y-1.5">
                    <p className="text-xs text-emerald-400 font-bold">📍 নার্সারির ঠিকানা:</p>
                    <p className="text-xs text-white">{LOCATION}</p>
                    <p className="text-[11px] text-emerald-300/80">সরাসরি নার্সারিতে এসেও চারা দেখে নেওয়া যাবে।</p>
                  </div>

                  <div className="p-4 rounded-xl bg-nursery-900/60 border border-emerald-800 text-left space-y-1.5">
                    <p className="text-xs text-emerald-400 font-bold">📞 হটলাইন ও পরামর্শ:</p>
                    <p className="text-sm font-extrabold text-white">{BRAND_PHONE}</p>
                    <p className="text-xs text-emerald-300">{ALT_PHONE}</p>
                    <p className="text-[11px] text-emerald-200/60">গাছ রোপণ ও রোগবালাই দমনে ফ্রি পরামর্শ দেওয়া হয়।</p>
                  </div>

                </div>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="bg-nursery-950 border-t border-emerald-900 py-8 text-center text-xs text-emerald-300/60 space-y-2">
            <p className="text-white font-bold">গ্রীন ওয়ার্ল্ড নার্সারি • পুঠিয়া, রাজশাহী</p>
            <p>অর্ডার ও কুরিয়ার তথ্য: {BRAND_PHONE} | {BRAND_EMAIL}</p>
            <div className="pt-2 text-[11px] text-emerald-400/80">
              ডিজিটাল শোরুম পার্টনার: <a href="https://cryptowebbuild.com" target="_blank" className="underline font-bold text-emerald-300 hover:text-white">CryptoWebBuild</a>
            </div>
          </footer>

          {/* Order Modal Drawer */}
          {orderModalProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="relative w-full max-w-lg bg-nursery-950 border-2 border-emerald-500/40 rounded-2xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                
                {/* Close Button */}
                <button 
                  onClick={() => setOrderModalProduct(null)}
                  className="absolute top-4 right-4 text-emerald-300 hover:text-white bg-nursery-900 p-2 rounded-full border border-emerald-700"
                >
                  ✕
                </button>

                {/* Modal Header */}
                <div className="border-b border-emerald-500/20 pb-4 flex gap-3.5 items-center">
                  <img 
                    src={orderModalProduct.image} 
                    alt={orderModalProduct.title} 
                    className="w-16 h-16 rounded-xl object-cover border border-emerald-500/30 flex-shrink-0"
                  />
                  <div>
                    <span className="text-[11px] font-bold text-emerald-400 uppercase tracking-wider">অর্ডার বুকিং ড্রয়ার</span>
                    <h4 className="text-sm font-bold text-white mt-0.5 leading-snug">
                      {orderModalProduct.title}
                    </h4>
                    <div className="flex items-center gap-2 mt-1">
                      <span className="text-base font-extrabold text-emerald-400">
                        ৳{orderModalProduct.price}
                      </span>
                      <span className="text-xs text-emerald-300/50 line-through">
                        ৳{orderModalProduct.originalPrice}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Booking Form */}
                <form onSubmit={handleConfirmWhatsApp} className="space-y-4 text-xs">
                  
                  {/* Quantity selector */}
                  <div>
                    <label className="block text-emerald-200 font-semibold mb-1">
                      চারার সংখ্যা (পরিমাণ):
                    </label>
                    <div className="flex items-center gap-3">
                      <button 
                        type="button" 
                        onClick={() => setQuantity(Math.max(1, quantity - 1))}
                        className="w-9 h-9 rounded-lg bg-nursery-900 border border-emerald-700 text-white font-bold text-lg flex items-center justify-center"
                      >
                        -
                      </button>
                      <span className="text-base font-extrabold text-white px-3">{quantity} টি চারা</span>
                      <button 
                        type="button" 
                        onClick={() => setQuantity(quantity + 1)}
                        className="w-9 h-9 rounded-lg bg-nursery-900 border border-emerald-700 text-white font-bold text-lg flex items-center justify-center"
                      >
                        +
                      </button>
                    </div>
                  </div>

                  {/* Customer Name */}
                  <div>
                    <label className="block text-emerald-200 font-semibold mb-1">
                      আপনার নাম <span className="text-red-400">*</span>
                    </label>
                    <input 
                      type="text" 
                      required
                      placeholder="যেমন: মোঃ কামরুল ইসলাম"
                      value={customerName}
                      onChange={e => setCustomerName(e.target.value)}
                      className="w-full bg-nursery-900 border border-emerald-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-400"
                    />
                  </div>

                  {/* Customer Phone */}
                  <div>
                    <label className="block text-emerald-200 font-semibold mb-1">
                      মোবাইল নম্বর <span className="text-red-400">*</span>
                    </label>
                    <input 
                      type="tel" 
                      required
                      placeholder="যেমন: 017xxxxxxxx"
                      value={customerPhone}
                      onChange={e => setCustomerPhone(e.target.value)}
                      className="w-full bg-nursery-900 border border-emerald-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-400"
                    />
                  </div>

                  {/* Delivery Area */}
                  <div>
                    <label className="block text-emerald-200 font-semibold mb-1">
                      ডেলিভারি এরিয়া সিলেক্ট করুন:
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setSelectedDistrict('rajshahi')}
                        className={'p-2.5 rounded-lg border font-semibold text-center ' + (
                          selectedDistrict === 'rajshahi'
                            ? 'bg-emerald-900/80 border-emerald-400 text-emerald-200'
                            : 'bg-nursery-900 border-emerald-900 text-emerald-400/60'
                        )}
                      >
                        রাজশাহী জেলা (৳১০০)
                      </button>
                      <button
                        type="button"
                        onClick={() => setSelectedDistrict('outside')}
                        className={'p-2.5 rounded-lg border font-semibold text-center ' + (
                          selectedDistrict === 'outside'
                            ? 'bg-emerald-900/80 border-emerald-400 text-emerald-200'
                            : 'bg-nursery-900 border-emerald-900 text-emerald-400/60'
                        )}
                      >
                        সারা বাংলাদেশ কুরিয়ার (৳১৫০)
                      </button>
                    </div>
                  </div>

                  {/* Full Address */}
                  <div>
                    <label className="block text-emerald-200 font-semibold mb-1">
                      পূর্ণাঙ্গ ঠিকানা (গ্রাম/উপজেলা/জেলা) <span className="text-red-400">*</span>
                    </label>
                    <textarea 
                      required
                      rows="2"
                      placeholder="গ্রাম, ইউনিয়ন, থানা ও জেলার নাম..."
                      value={customerAddress}
                      onChange={e => setCustomerAddress(e.target.value)}
                      className="w-full bg-nursery-900 border border-emerald-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-400"
                    ></textarea>
                  </div>

                  {/* Price Calculation Summary */}
                  <div className="bg-nursery-900/90 rounded-xl p-3 border border-emerald-800 space-y-1.5">
                    <div className="flex justify-between text-emerald-200">
                      <span>চারাগাছের মূল্য ({quantity} টি):</span>
                      <span className="font-bold">৳{subtotal}</span>
                    </div>
                    <div className="flex justify-between text-emerald-200">
                      <span>কুরিয়ার ও প্যাকিং চার্জ:</span>
                      <span className="font-bold">৳{deliveryCharge}</span>
                    </div>
                    <div className="border-t border-emerald-800 pt-1.5 flex justify-between text-sm font-extrabold text-emerald-400">
                      <span>সর্বমোট প্রদেয়:</span>
                      <span>৳{totalAmount}</span>
                    </div>
                  </div>

                  {/* Submit Button */}
                  <button 
                    type="submit"
                    className="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-stone-950 font-extrabold text-sm shadow-xl transition flex items-center justify-center gap-2"
                  >
                    <span>💬 হোয়াটসঅ্যাপে অর্ডার কনফার্ম করুন</span>
                  </button>

                  <p className="text-[10px] text-center text-emerald-300/70">
                    🔒 ক্যাশ অন ডেলিভারি — চারা হাতে পেয়ে মূল্য পরিশোধ করার সুযোগ।
                  </p>

                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
